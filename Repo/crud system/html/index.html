<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- boot strap css-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <!-- css -->
    <link rel="stylesheet" href="../html,css/style.css">
    <!-- font awsome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="bg-body-tertiary">

    <div class="parent w-75 mx-auto p-5 shadow m-5 bg-white">
        <h1 class="fw-bolder text-center mb-5 text-uppercase">crud system</h1>
        <div class="form-floating mb-3">
            <input type="text" class="form-control border-0 border-bottom rounded-0" id="productName"
                placeholder="enter_productName">
            <label for="productName">product Name</label>
        </div>
        <div class="form-floating mb-3">
            <input type="number" class="form-control border-0 border-bottom rounded-0" id="productPrice"
                placeholder="enter_productPrice">
            <label for="productPrice">product price</label>
        </div>
        <div class="form-floating mb-3">
            <input list="catogery" type="text" class="form-control border-0 border-bottom rounded-0"
                id="productCatogery" placeholder="enter_productCatogery">
            <label for="productCatogery">product Catogery</label>
            <datalist id="catogery">
                <option value="TV"></option>
                <option value="Laptop"></option>
                <option value="Screens"></option>
                <option value="Mobiles"></option>
                <option value="Electronics"></option>

            </datalist>
        </div>
        <div class="form-floating mb-3">
            <input type="file" class="form-control border-0 border-bottom rounded-0" id="productImage"
                placeholder="enter_productImage">
            <label for="productImage">product Image</label>
            <div class="form-floating mt-3">
                <textarea class="form-control " placeholder="Leave a comment here" id="productDesc"
                    style="height: 100px"></textarea>
                <label for="productDesc">Descreption</label>
            </div>
            <button class="btn btn-info text-light m-3 rounded-0" id="addBtn">Add product</button>
            <button class="btn btn-danger text-light m-3 rounded-0" id="btnreset" onclick="reset()">reset</button>
        </div>
    </div>

    <input type="text" id="Search" placeholder="Search Product Name" class="form-control w-75 mx-auto " oninput="searchProduct()">


    <div class="container mt-5">
        <div class="row gy-5 py-5 bg-body-tertiary mt-5" id="rowBody">
        </div>
    </div>
    <!--bootstrap js  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <!-- file of js  -->
    <script src="../js/script.js"></script>
</body>

</html>
