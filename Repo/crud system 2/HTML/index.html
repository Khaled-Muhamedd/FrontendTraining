<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crud</title>

    <!-- fontawsome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- css bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <!-- css -->
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>
    <div class="w-75 mx-auto shadow p-5 mt-5 ">
        <div class="container">
            <div class="mt-3">
                <label for="userName"></label>
                <input type="text" id="userName" required class="form-control" placeholder="Name">
            </div>
            <div class="mt-3">
                <label for="userPhone"></label>
                <input type="tel" id="userPhone" required class="form-control" placeholder="Phone">
            </div>
            <div class="mt-3">
                <label for="userEmail"></label>
                <input type="email" id="userEmail" required class="form-control" placeholder="Email">
            </div>
            <button class="btn btn-danger w-100 mt-4" id="createBtn" onclick="add()">Create</button>
            <button class="btn btn-primary w-100 mt-4" onclick="reset()">reset</button>
        </div>
    </div>
    <div class="container mt-5 shadow">
        <table class="table table-striped text-center">
            <thead>
            <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="Tbody">
            
        </tbody>
        </table>
    </div>

    <!-- bootstrap js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <!-- js -->
    <script src="../Js/script.js"></script>
</body>

</html>
